name: CI

on:
  push:
  pull_request:
  # вызывается из deploy.yml: образы не собираются и выкладка не идёт, пока CI не зелёный
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: logistix
          POSTGRES_PASSWORD: logistix
          POSTGRES_DB: logistix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U logistix" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://logistix:logistix@127.0.0.1:5432/logistix
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Роль приложения logistix_app (как в docker-compose)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../deploy/db-init.sql
      - run: pytest -q
      - name: check --deploy с примером продакшен-окружения (без предупреждений)
        run: |
          set -a; . ../deploy/.env.prod.example; set +a
          # HSTS в примере выключен намеренно (включается ступенями после проверки TLS, см. RUNBOOK)
          export DJANGO_SILENCED_CHECKS=security.W004
          python manage.py check --deploy --fail-level WARNING
      - name: RLS под ролью приложения
        env:
          DJANGO_DEBUG: "true"
        run: |
          python manage.py migrate --noinput
          DATABASE_URL=postgres://logistix_app:logistix_app@127.0.0.1:5432/logistix \
            python manage.py check_rls

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Синтаксис shell-скриптов
        run: for f in deploy/*.sh; do bash -n "$f"; done
      - name: docker compose config
        run: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod.example --env-file deploy/.image_tag.env.example config -q
      - name: Тесты shell-скриптов (без Docker)
        run: bash deploy/test-scripts.sh
