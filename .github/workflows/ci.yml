name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: logistix
          POSTGRES_PASSWORD: logistix
          POSTGRES_DB: logistix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U logistix" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://logistix:logistix@127.0.0.1:5432/logistix
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Роль приложения logistix_app (как в docker-compose)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../deploy/db-init.sql
      - run: pytest -q
      - name: RLS под ролью приложения
        env:
          DJANGO_DEBUG: "true"
        run: |
          python manage.py migrate --noinput
          DATABASE_URL=postgres://logistix_app:logistix_app@127.0.0.1:5432/logistix \
            python manage.py check_rls

  web:
    runs-on: ubuntu-latest
    # Пропускается, пока не появится web/package.json (Task 15).
    steps:
      - uses: actions/checkout@v4
      - name: Проверка наличия web/package.json
        id: detect
        run: |
          if [ -f web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "20"
      - if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: npm ci && npm run lint --if-present && npm test --if-present && npm run build
