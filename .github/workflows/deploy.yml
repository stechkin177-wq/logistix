# Сборка образов в GHCR и выкладка по SSH.
#   push в main        -> staging  (теги образов sha-<короткий SHA> и staging)
#   тег vX.Y.Z         -> production (GitHub Environment "production" с обязательным
#                         подтверждением; тег образа = git-тег)
#   workflow_dispatch  -> ручная выкладка/откат: образ image_tag в выбранное окружение
# Секреты и переменные - в Environments (staging, production), список в docs/ops/RUNBOOK.md:
#   secrets: DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER, DEPLOY_KNOWN_HOSTS, GHCR_PULL_TOKEN
#   vars:    DEPLOY_PATH (каталог клона репозитория на сервере), APP_URL (https://...)
# .env.prod лежит на сервере заранее (в GitHub не хранится). Секреты в логи не печатаются.
# Файл проверен только парсером YAML: actionlint и GitHub в разработке были недоступны.
name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Окружение
        type: choice
        options: [staging, production]
        required: true
      image_tag:
        description: "Тег образа (sha-abc1234, v1.2.3) - для отката укажите предыдущий"
        type: string
        required: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.p.outputs.environment }}
      image_tag: ${{ steps.p.outputs.image_tag }}
      git_ref: ${{ steps.p.outputs.git_ref }}
      build: ${{ steps.p.outputs.build }}
    steps:
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          IN_ENV: ${{ inputs.environment }}
          IN_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          short="sha-${SHA::7}"
          if [[ "$EVENT" == workflow_dispatch ]]; then
            [[ "$IN_TAG" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || { echo "недопустимый image_tag"; exit 1; }
            env_name="$IN_ENV"; tag="$IN_TAG"; build=false
            if [[ "$tag" == sha-* ]]; then ref="${tag#sha-}"; else ref="$tag"; fi
          elif [[ "$REF_TYPE" == tag ]]; then
            env_name=production; tag="$REF_NAME"; ref="$REF_NAME"; build=true
          else
            env_name=staging; tag="$short"; ref="$SHA"; build=true
          fi
          {
            echo "environment=$env_name"
            echo "image_tag=$tag"
            echo "git_ref=$ref"
            echo "build=$build"
          } >>"$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: logistix-backend
            dockerfile: deploy/Dockerfile.backend
          - image: logistix-web
            dockerfile: deploy/Dockerfile.web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ needs.prepare.outputs.image_tag }}
          ENV_NAME: ${{ needs.prepare.outputs.environment }}
          SHA: ${{ github.sha }}
        run: |
          owner="$(echo "$OWNER" | tr 'A-Z' 'a-z')"
          tags="ghcr.io/$owner/${{ matrix.image }}:$TAG"
          # на main - ещё плавающий тег staging; для релиза-тега - ещё sha-<коммит>
          if [[ "$ENV_NAME" == staging ]]; then tags="$tags,ghcr.io/$owner/${{ matrix.image }}:staging"; fi
          if [[ "$ENV_NAME" == production ]]; then tags="$tags,ghcr.io/$owner/${{ matrix.image }}:sha-${SHA::7}"; fi
          echo "tags=$tags" >>"$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.names.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: [prepare, build]
    # build пропускается при ручном откате (образ уже в реестре)
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.prepare.outputs.environment }}
      url: ${{ vars.APP_URL }}
    # два выката в одно окружение не пересекаются, поздний ждёт; прерывать начатый нельзя
    concurrency:
      group: deploy-${{ needs.prepare.outputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: SSH-ключ и known_hosts
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" >~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
      - name: Выкладка на сервер
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          TAG: ${{ needs.prepare.outputs.image_tag }}
          GIT_REF: ${{ needs.prepare.outputs.git_ref }}
        run: |
          set -euo pipefail
          # токен реестра - через stdin, не в аргументах команды
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$HOST" \
            "cd '$DEPLOY_PATH' && GHCR_USER='$GHCR_USER' ./deploy/release.sh '$TAG' '$GIT_REF'"
      - name: Дымовая проверка
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if SMOKE_CHECK_HEADERS=1 ./deploy/smoke.sh "$APP_URL"; then exit 0; fi
            echo "повтор через 10 с ($i/6)"; sleep 10
          done
          echo "дымовая проверка не пройдена - откатитесь: workflow_dispatch с прежним image_tag" >&2
          exit 1
      - name: Удалить ключ
        if: always()
        run: rm -f ~/.ssh/deploy_key
