# Общие параметры проксирования на backend (include из каждого проксирующего location).
proxy_http_version 1.1;
proxy_set_header Connection "";
# Host без изменений: по нему определяется компания / пользовательский домен
proxy_set_header Host $host;
# ПЕРЕЗАПИСЬ заголовков, не дополнение: клиентский X-Forwarded-For отбрасывается.
# Нельзя заменять на $proxy_add_x_forwarded_for (приложение доверяет первому адресу).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
# Эти заголовки выставляет nginx (security-headers.conf) - убираем дубли от Django
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
