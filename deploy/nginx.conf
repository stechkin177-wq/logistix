# nginx для Logistix: reverse proxy на backend, SPA, статика и медиа с общих томов, TLS.
# `nginx -t` в среде разработки НЕ запускался (nginx там нет): конфиг проверен глазами.
# Первый запуск: nginx -t внутри контейнера (docker compose exec nginx nginx -t).
#
# Требования безопасности (ledger Task 8/9/14):
#  - X-Forwarded-For ПЕРЕЗАПИСЫВАЕТСЯ ($remote_addr), никогда $proxy_add_x_forwarded_for:
#    приложение (TRUST_PROXY_HEADERS=true) доверяет первому адресу; цепочку клиент подделает.
#  - Host пробрасывается без изменений (определение компании по домену).
#    Все проксируемые location подключают deploy/nginx-proxy-backend.conf (там эти заголовки).
#  - Тело запроса <= 2m (Django буферизует загрузку до проверки 1 МБ).
#  - /media/: тип только по расширению (картинки), иначе octet-stream; nosniff; без скриптов.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    log_format main '$remote_addr "$host" "$request" $status $body_bytes_sent '
                    'rt=$request_time "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # --- ограничение частоты на границе (по реальному IP клиента; за CDN/другим прокси
    # $remote_addr будет адресом прокси - тогда нужен realip-модуль) ---
    limit_req_status 429;
    # вход: 5 запросов в минуту на IP, всплеск 5 (подбор пароля)
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    # публичное оформление экрана входа: 30 в минуту, всплеск 20 (приложение ещё режет 60/min)
    limit_req_zone $binary_remote_addr zone=branding:10m rate=30r/m;

    # Docker DNS: backend резолвится при каждом запросе (иначе nginx не стартует без backend
    # и держит старый IP после его пересоздания)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Content-Disposition для медиа: картинки отображаются, всё остальное - только скачивание
    map $uri $media_disposition {
        default "attachment";
        ~*\.(png|jpe?g|webp|gif)$ "";
    }

    # --- HTTP: ACME, health без редиректа, остальное - на https ---
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        # проверка живости самого nginx (HEALTHCHECK образа)
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # мониторинг без TLS (health не содержит данных); Host не проверяется
        location = /api/health/ {
            set $backend http://backend:8000;
            proxy_pass $backend;
            include /etc/nginx/snippets/proxy-backend.conf;
            access_log off;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS ---
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        # Сертификат: certbot --cert-name logistix или сертификат hoster.kz в этом же каталоге
        ssl_certificate /etc/letsencrypt/live/logistix/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/logistix/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        root /usr/share/nginx/html;

        # API и админка Django. Заголовки от Django, дублирующие наши, скрываем.
        location ~ ^/(api|admin)/ {
            set $backend http://backend:8000;
            proxy_pass $backend;
            include /etc/nginx/snippets/proxy-backend.conf;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        location = /api/auth/login/ {
            limit_req zone=login burst=5 nodelay;
            set $backend http://backend:8000;
            proxy_pass $backend;
            include /etc/nginx/snippets/proxy-backend.conf;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
        }

        location = /api/branding/ {
            limit_req zone=branding burst=20 nodelay;
            set $backend http://backend:8000;
            proxy_pass $backend;
            include /etc/nginx/snippets/proxy-backend.conf;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
        }

        # /api/health/ без аутентификации и без ограничений (доходит до Django как обычно)
        location = /api/health/ {
            set $backend http://backend:8000;
            proxy_pass $backend;
            include /etc/nginx/snippets/proxy-backend.conf;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
        }

        # Статика Django (admin, DRF): имена без хеша -> умеренный срок кэша
        location /static/ {
            alias /srv/static/;
            access_log off;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=86400" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        }

        # Медиа (логотипы): никаких скриптов. Только картинки по расширению; остальное -
        # octet-stream + attachment. CSP sandbox запрещает исполнение при прямом открытии.
        location /media/ {
            alias /srv/media/;
            default_type application/octet-stream;
            types {
                image/png png;
                image/jpeg jpg jpeg;
                image/webp webp;
                image/gif gif;
            }
            add_header Cache-Control "public, max-age=3600" always;
            add_header Content-Disposition $media_disposition always;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        }

        # Хешированные ассеты Vite: неизменяемы, год
        location /assets/ {
            access_log off;
            try_files $uri =404;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        }

        # SPA: любой другой путь -> index.html; index.html не кэшируется.
        # CSP строгая: у собранного Vite index.html нет inline-скриптов (только <script type=module src>).
        location / {
            try_files $uri /index.html;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }
    }
}
