# Заголовки безопасности. Подключается include-ом в КАЖДЫЙ location, где есть свои add_header
# (add_header в location сбрасывает унаследованные из server). CSP задаётся в самих location.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
# HSTS здесь НЕ добавляется: единый источник - DJANGO_HSTS_SECONDS в .env.prod (по умолчанию 0,
# включение - RUNBOOK, раздел «HSTS»). Django ставит заголовок только на https-ответах за прокси.
