# Заголовки безопасности. Подключается include-ом в КАЖДЫЙ location, где есть свои add_header
# (add_header в location сбрасывает унаследованные из server). CSP задаётся в самих location.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
# HSTS: включать ТОЛЬКО после проверки TLS (раскомментировать и ступенчато повышать max-age).
# Должно совпадать с DJANGO_HSTS_SECONDS (Django HSTS не добавляет за прокси без TLS-проверки).
# add_header Strict-Transport-Security "max-age=3600; includeSubDomains" always;
