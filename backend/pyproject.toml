[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[project]
name = "logistix-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.1,<6",
  "djangorestframework>=3.15",
  "djangorestframework-simplejwt>=5.3",
  "django-cors-headers>=4.4",
  "psycopg[binary]>=3.2",
  "dj-database-url>=2.2",
  "celery>=5.4",
  "redis>=5.0",
  "openpyxl>=3.1",
  "gunicorn>=23.0",
  "sentry-sdk>=2.20",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-django", "pytest-env", "factory-boy", "time-machine", "ruff"]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
